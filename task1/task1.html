    <div class="contact-container">

        <h1>Contact Form</h1>

        <form action="#" method="get">

            <label for="name">Name:</label>
            <input
                type="text"
                id="name"
                name="name"
                required
                minlength="2"
                maxlength="50"
            >

            <label for="email">Email:</label>
            <input
                type="email"
                id="email"
                name="email"
                required
                maxlength="100"
            >

            <label for="message">Message:</label>
            <textarea
                id="message"
                name="message"
                rows="5"
                required
                minlength="10"
                maxlength="500"
            ></textarea>

            <button type="submit">Submit</button>

        </form>

    </div>

</body>
</html>
