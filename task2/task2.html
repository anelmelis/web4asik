<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="task2.css">
</head>
<body>

    <nav class="navbar-custom">
        <a href="../task0/task0.html">Task 0</a>
        <a href="../task1/task1.html">Task 1</a>
        <a href="task2.html">Task 2</a>
        <a href="../task3/task3.html">Task 3</a>
        <a href="../task4/task4.html">Task 4</a>
    </nav>

    <div class="container form-container">
        <h1 class="text-center mb-4">Contact Form</h1>

        <form action="#" method="get">

            <div class="row g-3">

                <div class="col-md-6">
                    <label for="name" class="form-label">Name:</label>
                    <input
                        type="text"
                        class="form-control"
                        id="name"
                        name="name"
                        placeholder="Enter your name"
                    >
                </div>

                <div class="col-md-6">
                    <label for="email" class="form-label">Email:</label>
                    <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="name@example.com"
                        aria-describedby="emailHelp"
                    >
                    <div id="emailHelp" class="form-text">
                        We'll never share your email with anyone else.
                    </div>
                </div>

                <div class="col-12">
                    <label for="message" class="form-label">Message:</label>
                    <textarea
                        class="form-control"
                        id="message"
                        name="message"
                        rows="5"
                        placeholder="Write your message here..."
                        aria-describedby="messageHelp"
                    ></textarea>
                    <div id="messageHelp" class="form-text">
                        Please describe your question or feedback.
                    </div>
                </div>

                <div class="col-12">
                    <button type="submit" class="btn btn-primary w-100">
                        Submit
                    </button>
                </div>

            </div>

        </form>
    </div>

</body>
</html>
